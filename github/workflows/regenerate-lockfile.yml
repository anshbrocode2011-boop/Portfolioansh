name: Regenerate package-lock

on:
  workflow_dispatch: {}
  push:
    branches:
      - main
    paths-ignore:
      - 'package-lock.json'

jobs:
  regen-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Use Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Remove existing lockfile
        run: |
          if [ -f package-lock.json ]; then rm package-lock.json; fi

      - name: Install dependencies (regenerate lockfile)
        run: |
          npm install

      - name: Show tailwind resolution
        run: |
          echo "Resolved tailwind version:" && npm ls tailwindcss || true

      - name: Commit package-lock.json if changed
        env:
          GIT_AUTHOR_NAME: github-actions[bot]
          GIT_AUTHOR_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          git config user.name "${GIT_AUTHOR_NAME}"
          git config user.email "${GIT_AUTHOR_EMAIL}"
          git add package-lock.json package.json || true
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: regenerate package-lock.json (via workflow)"
            git push origin HEAD:main
          fi
